teX(421.0px)}38.182%{transform:translateX(539.0px)}46.364%{transform:translateX(657.0px)}54.545%{transform:translateX(775.0px)}58.636%{transform:translateX(834.0px)}72.727%{transform:translateX(834.0px)}77.273%{transform:translateX(893.0px)}100.0%{transform:translateX(893.0px)}}@keyframes dotv{0%{opacity:0}1.364%,80.909%{opacity:1}85.455%,100%{opacity:0}}.dotg{animation:dot 11.0s linear infinite,dotv 11.0s linear infinite}@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}.gate{animation:pulse 1.4s ease-in-out infinite}}</style>
